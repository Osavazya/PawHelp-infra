apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-addons-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: pawhelp
  source:
    repoURL: https://github.com/Osavazya/PawHelp-infra.git
    targetRevision: prod
    path: helm/platform
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    name: pawhelp-prod
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
