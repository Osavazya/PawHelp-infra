apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawhelp
  namespace: argocd
spec:
  description: PawHelp applications and platform services
  sourceRepos:
    - https://github.com/Osavazya/PawHelp-infra.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - namespace: pawhelp-dev
      server: https://kubernetes.default.svc
    - namespace: pawhelp-prod
      server: https://kubernetes.default.svc
    - namespace: monitoring-dev
      server: https://kubernetes.default.svc
    - namespace: crm-dev
      server: https://kubernetes.default.svc
    - namespace: monitoring-prod
      server: https://kubernetes.default.svc
    - namespace: crm-prod
      server: https://kubernetes.default.svc
    - namespace: teamcity
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

