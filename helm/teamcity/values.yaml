server:
  image:
    repository: jetbrains/teamcity-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8111
  ingress:
    enabled: true
    className: traefik
    host: teamcity.pawhelp.localhost
  persistence:
    dataSize: 20Gi
    logsSize: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi

agent:
  enabled: true
  replicas: 1
  image:
    repository: jetbrains/teamcity-agent
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

