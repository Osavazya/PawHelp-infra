{{- if and .Values.server.ingress.enabled .Values.server.internalAccess.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: teamcity-vpn-only
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.server.internalAccess.allowedCIDRs }}
      - {{ . | quote }}
      {{- end }}
---
{{- end }}
{{- if .Values.server.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-teamcity-server
  {{- with .Values.server.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.server.ingress.className }}
  {{- if .Values.server.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.server.ingress.host }}
      secretName: {{ .Values.server.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.server.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-teamcity-server
                port:
                  name: http
{{- end }}
