image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

auth:
  database: pawhelp
  username: pawhelp
  password: pawhelp_password

externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  data: []

persistence:
  size: 8Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 7
  storageSize: 8Gi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  s3:
    enabled: false
    secretName: ""
    awsCliImage:
      repository: public.ecr.aws/aws-cli/aws-cli
      tag: "2.15.40"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
    externalSecret:
      enabled: false
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: aws-parameter-store
      data: []

nodeSelector: {}
olerations: []
