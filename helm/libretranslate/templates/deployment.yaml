{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-libretranslate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: libretranslate
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libretranslate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: libretranslate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: LT_LOAD_ONLY
              value: {{ .Values.languages | quote }}
            - name: LT_DISABLE_WEB_UI
              value: "true"
            - name: LT_UPDATE_MODELS
              value: "true"
          readinessProbe:
            httpGet:
              path: /languages
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}

