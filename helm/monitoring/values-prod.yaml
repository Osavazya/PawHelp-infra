kube-prometheus-stack:
  fullnameOverride: monitoring
  grafana:
    enabled: true
    adminPassword: REPLACE_WITH_EXTERNAL_SECRET
    service:
      type: ClusterIP
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.pawhelp.localhost
  prometheus:
    prometheusSpec:
      retention: 15d
      scrapeInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: 1500m
          memory: 2048Mi
  alertmanager:
    enabled: true

loki:
  useTestSchema: true
  deploymentMode: SingleBinary
  loki:
    useTestSchema: true
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

promtail:
  config:
    clients:
      - url: http://monitoring-prod-loki:3100/loki/api/v1/push
