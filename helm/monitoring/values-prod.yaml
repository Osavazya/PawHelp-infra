internalAccess:
  enabled: true
  allowedCIDRs:
    - 10.45.0.0/24

kube-prometheus-stack:
  fullnameOverride: monitoring
  grafana:
    enabled: true
      nodeSelector:
        pawhelp.io/node-pool: infra
      tolerations:
        - key: pawhelp.io/node-pool
          operator: Equal
          value: infra
          effect: NoSchedule    adminPassword: REPLACE_WITH_EXTERNAL_SECRET
    service:
      type: ClusterIP
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: monitoring-prod-grafana-vpn-only@kubernetescrd
        cert-manager.io/cluster-issuer: pawhelp-selfsigned
      hosts:
        - grafana.prod.pawhelp.internal
      tls:
        - secretName: grafana-prod-internal-tls
          hosts:
            - grafana.prod.pawhelp.internal
  prometheus:
    prometheusSpec:
      nodeSelector:
        pawhelp.io/node-pool: infra
      tolerations:
        - key: pawhelp.io/node-pool
          operator: Equal
          value: infra
          effect: NoSchedule
      retention: 15d
      scrapeInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: 1500m
          memory: 2048Mi
  alertmanager:
    enabled: true
    alertmanagerSpec:
      nodeSelector:
        pawhelp.io/node-pool: infra
      tolerations:
        - key: pawhelp.io/node-pool
          operator: Equal
          value: infra
          effect: NoSchedule

loki:
  useTestSchema: true
  deploymentMode: SingleBinary
  loki:
    useTestSchema: true
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
  singleBinary:
    nodeSelector:
      pawhelp.io/node-pool: infra
    tolerations:
      - key: pawhelp.io/node-pool
        operator: Equal
        value: infra
        effect: NoSchedule
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

promtail:
  tolerations:
    - key: pawhelp.io/node-pool
      operator: Equal
      value: infra
      effect: NoSchedule
  config:
    clients:
      - url: http://monitoring-prod-loki:3100/loki/api/v1/push
