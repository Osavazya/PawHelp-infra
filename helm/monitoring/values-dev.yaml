internalAccess:
  enabled: true
  allowedCIDRs:
    - 10.44.0.0/24

kube-prometheus-stack:
  fullnameOverride: monitoring
  grafana:
    enabled: true
    adminPassword: admin
    nodeSelector:
      pawhelp.io/node-pool: infra
    tolerations:
      - key: pawhelp.io/node-pool
        operator: Equal
        value: infra
        effect: NoSchedule
    service:
      type: ClusterIP
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: monitoring-dev-grafana-vpn-only@kubernetescrd
        cert-manager.io/cluster-issuer: pawhelp-selfsigned
      hosts:
        - grafana.dev.pawhelp.internal
      tls:
        - secretName: grafana-dev-internal-tls
          hosts:
            - grafana.dev.pawhelp.internal
  prometheus:
    prometheusSpec:
      nodeSelector:
        pawhelp.io/node-pool: infra
      tolerations:
        - key: pawhelp.io/node-pool
          operator: Equal
          value: infra
          effect: NoSchedule
      retention: 7d
      scrapeInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 150m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1536Mi
  alertmanager:
    enabled: true
    alertmanagerSpec:
      nodeSelector:
        pawhelp.io/node-pool: infra
      tolerations:
        - key: pawhelp.io/node-pool
          operator: Equal
          value: infra
          effect: NoSchedule

loki:
  useTestSchema: true
  deploymentMode: SingleBinary
  loki:
    useTestSchema: true
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
  singleBinary:
    nodeSelector:
      pawhelp.io/node-pool: infra
    tolerations:
      - key: pawhelp.io/node-pool
        operator: Equal
        value: infra
        effect: NoSchedule
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

promtail:
  tolerations:
    - key: pawhelp.io/node-pool
      operator: Equal
      value: infra
      effect: NoSchedule
  config:
    clients:
      - url: http://monitoring-dev-loki:3100/loki/api/v1/push